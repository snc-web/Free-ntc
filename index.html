<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FREE NTC/NCELL - 60GB Offer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff6600, #ffb347, #ffcc66);
    background-size: 400% 400%;
    animation: gradient 8s ease infinite;
    color: #fff;
  }
  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .glass-card {
    width: 90%;
    max-width: 420px;
    padding: 2rem;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    text-align: center;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  h1 {
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #fff, #ffe066, #fff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 25px rgba(255,255,255,0.5);
    margin-bottom: 0.8rem;
  }

  h2 {
    font-size: 1.6rem;
    font-weight: 600;
    color: #fff;
    margin-bottom: 0.3rem;
  }

  p {
    font-size: 1rem;
    color: rgba(255,255,255,0.9);
    margin-bottom: 1.5rem;
  }

  input[type="tel"] {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    text-align: center;
    backdrop-filter: blur(8px);
    margin-bottom: 1.2rem;
  }
  input::placeholder {
    color: rgba(255,255,255,0.7);
  }

  button {
    width: 100%;
    padding: 12px;
    font-size: 1.1rem;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #ff7b00, #ffcc00);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 0 15px rgba(255,255,255,0.4);
    transition: all 0.3s ease;
  }
  button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(255,255,255,0.7);
  }

  footer {
    margin-top: 1.3rem;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.7);
  }
</style>
</head>
<body>
  <div class="glass-card">
    <h1>FREE NTC/NCELL</h1>
    <h2>Get 60GB Free Data</h2>
    <p>Enter your mobile number below to claim your data offer instantly.</p>

    <form id="claimForm">
      <input type="tel" id="phone" placeholder="Enter your mobile number" pattern="[0-9]{10}" required />
      <button type="submit">Claim Now</button>
    </form>

    <footer>Demo page for learning purpose – not an official offer.</footer>
  </div>

<script>
  document.getElementById('claimForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const num = document.getElementById('phone').value.trim();
    if(num.length >= 9) {
      const msg = encodeURIComponent(`Hello! I want to claim 60 GB free data. My number is ${num}`);
      window.location.href = `https://wa.me/9779766666187?text=${msg}`;
    } else {
      alert('Please enter a valid mobile number.');
    }
  });
</script>
</body>
</html>
