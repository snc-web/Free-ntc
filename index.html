<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FREE NTC/NCELL Data</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

  body{
    background:radial-gradient(circle at center,#3a007a,#000 80%);
    min-height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;
    color:#fff;overflow:hidden;text-align:center;
  }

  @keyframes glow{
    0%{text-shadow:0 0 10px #ff0040,0 0 20px #00ffea,0 0 30px #00ffea;}
    50%{text-shadow:0 0 25px #ff00ff,0 0 45px #00ffea,0 0 60px #00ff40;}
    100%{text-shadow:0 0 15px #00ffea,0 0 25px #ff0040,0 0 40px #00ffea;}
  }

  .glass-box{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:2rem;width:90%;max-width:400px;
    box-shadow:0 0 25px rgba(255,255,255,0.15);
    animation:fadeIn 1.2s ease-in-out;
  }

  @keyframes fadeIn{from{opacity:0;transform:scale(0.95);}to{opacity:1;transform:scale(1);}}

  h1{font-size:2.3rem;letter-spacing:1px;font-weight:700;margin-bottom:.8rem;animation:glow 2s infinite alternate;}
  h2{font-size:1.9rem;font-weight:600;margin-bottom:.5rem;animation:glow 2s infinite alternate-reverse;}
  p{color:#ddd;margin-bottom:1.5rem;font-size:1rem;}

  input[type="tel"]{
    width:100%;padding:12px;border:none;border-radius:10px;background:rgba(255,255,255,0.2);
    color:#fff;text-align:center;font-size:1rem;outline:none;margin-bottom:1rem;
  }

  input::placeholder{color:#bbb;}

  button{
    width:100%;padding:12px;border:none;border-radius:10px;font-size:1.1rem;
    color:#fff;background:linear-gradient(90deg,#ff0040,#00ffea,#00ff40);
    cursor:pointer;animation:glow 1.5s infinite alternate;transition:transform .25s ease;
  }

  button:hover{transform:scale(1.05);}
  footer{margin-top:1rem;font-size:.8rem;color:#bbb;}

  .share-btn{
    position:fixed;right:20px;bottom:25px;background:linear-gradient(135deg,#ff00cc,#3333ff);
    border:none;border-radius:50%;width:60px;height:60px;font-size:28px;color:#fff;
    box-shadow:0 0 25px rgba(255,255,255,0.4);cursor:pointer;animation:pulse 2s infinite alternate;
  }

  @keyframes pulse{
    0%{transform:scale(1);box-shadow:0 0 10px #fff;}
    100%{transform:scale(1.1);box-shadow:0 0 30px #ff00ff;}
  }
</style>
</head>
<body>

<div class="glass-box">
  <h1>AUTHOR DHIRAJ</h1>
  <h2>FREE NTC / NCELL</h2>
  <p>Claim your 60GB free data offer now!</p>

  <form id="claimForm">
    <input type="tel" id="phone" placeholder="Enter your mobile number" required />
    <button type="submit">Claim Now</button>
  </form>

  <footer>Demo site — created by Dhiraj for learning purpose only.</footer>
</div>

<button class="share-btn" id="shareBtn">🔗</button>

<script>
  document.getElementById('claimForm').addEventListener('submit',function(e){
    e.preventDefault();
    const num=document.getElementById('phone').value.trim();
    if(num.length>=9){
      const msg=encodeURIComponent(`Hello! I want to claim 60GB free data. My number is ${num}`);
      window.location.href=`https://wa.me/9779766666187?text=${msg}`;
    }else{
      alert("Please enter a valid mobile number.");
    }
  });

  document.getElementById('shareBtn').addEventListener('click',async()=>{
    const shareData={
      title:"Free 60GB NTC/NCELL Offer",
      text:"Claim your 60GB free data now!",
      url:window.location.href
    };
    try{await navigator.share(shareData);}
    catch(err){alert("Sharing not supported on this device.");}
  });
</script>
</body>
</html>
